<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logos/dragonbot_fire.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DragonRestock — Never run out of stock again</title>
    <meta name="description" content="DragonRestock tracks your Amazon sales velocity and lead times, and tells you exactly when to reorder every SKU — so you never stock out." />
    <!-- Microsoft Clarity — project "DragonRestock" (y1peimheyt).
         One project per product: mixing products in a single project makes the
         recordings and heatmaps unreadable for both. track() mirrors GA4 events
         here as custom events, so sessions are tagged with the funnel step. -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "y1peimheyt");
    </script>
    <!-- Google Analytics — GA4 property "DragonRestock" (Ballistic Brands account).
         ⚠️ gtag MUST push the `arguments` object, not a rest-param array: a
         dataLayer.push(args) with an array is silently ignored by gtag.js and
         the property receives ZERO hits, not even page_view. This is the
         standard snippet; leave it exactly as Google emits it.
         Client-side route changes are reported separately — see
         trackRouteChange() in src/lib/track.js, since gtag('config') only
         fires a pageview on hard load. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7JMJEMLRZD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7JMJEMLRZD');
    </script>
    <!-- Meta Pixel — dataset "DragonRestock website" (28716421651297621).
         One dataset per product, all in the Dragon Suite portfolio: it keeps
         measurement, Custom Conversions and retargeting pools un-mixed.
         Products get pooled only as a combined lookalike SEED, at the audience
         layer (a Website Custom Audience accepts multiple pixels), never here.

         This base snippet is what makes the rest of the funnel work: every
         Meta call in src/lib/track.js is guarded by `typeof window.fbq`, so
         without it cta_click → InitiateCheckout silently no-ops and the
         retargeting pool stays empty, with no error anywhere. -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '28716421651297621');
      fbq('track', 'PageView');
    </script>
    <!-- Meta's <noscript> fallback img lives in <body>, not here: the HTML spec
         only allows link/style/meta inside a <noscript> in <head>, and parse5
         fails the Vite build on it. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=28716421651297621&ev=PageView&noscript=1" /></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
